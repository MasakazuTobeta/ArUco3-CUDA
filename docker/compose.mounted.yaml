# SPDX-License-Identifier: Apache-2.0
#
# Purpose:
#   Switch to the mode that keeps the CUDA Toolkit out of the image and instead
#   bind-mounts it read-only from the host. Overlay this on compose.yaml.
#
# Role:
#   A convenience for quick local experiments, and for a machine where installing
#   a second copy of the Toolkit into the image is not wanted.
#
#   Behaviour and performance in this mode are not guaranteed. The Toolkit comes
#   from the host, so the container is not reproducible and the version can
#   differ from the one the pinned image installs; on the GeForce RTX 5070 Ti it
#   does, 13.2 against 13.0. Measurements are taken in pinned mode, and the
#   verification the four machines run covers pinned mode. What is checked here
#   is that each profile builds and that the test suite passes; nothing more is
#   promised.
#
#   There is no jetson-thor service, and it is the one profile that cannot have
#   one. Its machine carries the driver alone - nvidia-l4t-cuda, which supplies
#   libcuda.so - and no CUDA Toolkit at all: no nvcc anywhere on disk and no
#   /usr/local/cuda. There is nothing on that host to mount, so a service here
#   could not be held to what the paragraph above promises. The reason mounted
#   mode exists, that a user who already has the Toolkit should not carry a
#   second copy in the image, does not arise there. Should a Toolkit be
#   installed on such a host, adding the service is the same four lines as the
#   others, plus a build and a test run to back it.
#
#   Overlaying this file on jetson-thor is not an error and not silent either:
#   compose finds no override, so the pinned image runs, and the first line
#   verify-environment.sh prints is "1. CUDA Toolkit (mode=pinned)", with the
#   provenance line agreeing. The mode a container is actually in is always
#   readable from the image rather than inferred from the command that started
#   it.
#
# Usage:
#   docker compose -f docker/compose.yaml -f docker/compose.mounted.yaml build dgx-spark
#   docker compose -f docker/compose.yaml -f docker/compose.mounted.yaml run --rm dgx-spark verify-environment.sh
#
# Notes:
#   /usr/local/cuda can be a chain of symlinks, so specify the real directory
#   with ARUCO3_CUDA_HOST_PATH_*.
services:
  dgx-spark:
    build:
      args:
        ARUCO3_CUDA_MODE: mounted
    image: aruco3-cuda:dgx-spark-mounted
    volumes:
      - ${ARUCO3_CUDA_HOST_PATH_DGX:-/usr/local/cuda-13.0}:/usr/local/cuda:ro

  jetson-orin:
    build:
      args:
        BASE_IMAGE: ${ARUCO3_JETSON_BASE_IMAGE_MOUNTED:-ubuntu:20.04}
        ARUCO3_CUDA_MODE: mounted
    image: aruco3-cuda:jetson-orin-mounted
    volumes:
      - ${ARUCO3_CUDA_HOST_PATH_JETSON:-/usr/local/cuda-11.4}:/usr/local/cuda:ro

  # The base image differs from pinned mode here, where it is ubuntu:24.04. The
  # host runs Ubuntu 22.04, and matching it keeps the mounted Toolkit binaries on
  # the userspace they were built for. A newer container would satisfy the glibc
  # requirement too, but nothing else about it is tested.
  rtx-blackwell:
    build:
      args:
        BASE_IMAGE: ${ARUCO3_RTX_BASE_IMAGE_MOUNTED:-ubuntu:22.04}
        ARUCO3_CUDA_MODE: mounted
    image: aruco3-cuda:rtx-blackwell-mounted
    volumes:
      - ${ARUCO3_CUDA_HOST_PATH_RTX:-/usr/local/cuda-13.2}:/usr/local/cuda:ro
