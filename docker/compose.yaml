# SPDX-License-Identifier: Apache-2.0
#
# 目的:
#   DGX Spark と Jetson Orin の 2 profile を同じ構成で起動する。
#
# CUDA Toolkit の供給方式:
#   この file は pinned mode を既定とする。必要な CUDA package を image へ
#   固定して含めるため、image が self-contained になり、測定結果の再現性が
#   host の CUDA 更新に影響されない。
#
#   host から mount する mode を使う場合は compose.mounted.yaml を重ねる。
#
# 使用方法:
#   docker compose -f docker/compose.yaml build dgx-spark
#   docker compose -f docker/compose.yaml run --rm dgx-spark verify-environment.sh
#   docker compose -f docker/compose.yaml run --rm dgx-spark
#
#   mounted mode:
#   docker compose -f docker/compose.yaml -f docker/compose.mounted.yaml build dgx-spark
name: aruco3-cuda

x-common: &common
  runtime: nvidia
  working_dir: /workspace
  # host の user で実行し、bind mount した repository へ root 所有の file を
  # 作らない。container 内に対応する user は無いが、build と test には支障ない。
  user: "${ARUCO3_UID:-1000}:${ARUCO3_GID:-1000}"
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ARUCO3_VERIFY_ON_START: "${ARUCO3_VERIFY_ON_START:-0}"
    # 対応する user が居ないため HOME が未定義になる。tool の cache 書き込み先を与える。
    HOME: /tmp
  # benchmark 時に測定条件を固定するため、既定の制限を外す。
  ulimits:
    memlock: -1
    stack: 67108864

services:
  # DGX Spark GB10 (Blackwell, sm_121)。開発と解析の主環境。
  dgx-spark:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ubuntu:24.04
        ARUCO3_PROFILE: dgx-spark
        ARUCO3_CUDA_ARCH: "121"
        ARUCO3_CUDA_MODE: "${ARUCO3_CUDA_MODE:-pinned}"
        ARUCO3_CUDA_REPO_DISTRO: ubuntu2404
        ARUCO3_CUDA_REPO_ARCH: sbsa
        INSTALL_DEV_TOOLS: "1"
    image: aruco3-cuda:dgx-spark
    volumes:
      - ..:/workspace
      - dgx-opencv-cuda:/opt/opencv-cuda

  # Jetson Orin (Ampere, sm_87)。実運用を想定した遅延・電力評価環境。
  # pinned mode では CUDA を含む l4t-jetpack を base image に使う。
  # install-cuda-toolkit.sh は base image に CUDA がある場合 install を省略する。
  # base image は実機の JetPack へ合わせて .env で上書きすること。
  jetson-orin:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ARUCO3_JETSON_BASE_IMAGE:-nvcr.io/nvidia/l4t-cuda:11.4.19-devel}
        ARUCO3_PROFILE: jetson-orin
        ARUCO3_CUDA_ARCH: "87"
        ARUCO3_CUDA_MODE: "${ARUCO3_CUDA_MODE:-pinned}"
        INSTALL_DEV_TOOLS: "0"
    image: aruco3-cuda:jetson-orin
    # Jetson の Tegra device node は root:video (一部は root:debug) の 0660 である。
    # host の user は video に属するが、container の user には補助グループが
    # 引き継がれない。付与しないと cudaGetDeviceCount が
    # 「NvRmMemInitNvmap failed with Permission denied」で失敗する。
    # GID は host 依存のため .env で上書きできるようにする。
    group_add:
      - "${ARUCO3_JETSON_VIDEO_GID:-44}"
      - "${ARUCO3_JETSON_DEBUG_GID:-995}"
    volumes:
      - ..:/workspace
      - jetson-opencv-cuda:/opt/opencv-cuda
      # 評価計画が測定条件として要求する power mode と L4T version の取得元。
      # nvpmodel の binary は container へ入らないため状態 file を直接読む。
      # いずれも world-readable であり read-only で mount する。
      - ${ARUCO3_JETSON_L4T_RELEASE:-/etc/nv_tegra_release}:/etc/nv_tegra_release:ro
      - ${ARUCO3_JETSON_NVPMODEL_STATE:-/var/lib/nvpmodel}:/var/lib/nvpmodel:ro
      - ${ARUCO3_JETSON_NVPMODEL_CONF:-/etc/nvpmodel.conf}:/etc/nvpmodel.conf:ro
      # device tree は Docker が /sys/firmware を mask するため直接読めない。
      # 基板名だけを個別に mount する。
      - ${ARUCO3_JETSON_MODEL_FILE:-/sys/firmware/devicetree/base/model}:/etc/aruco3cuda-platform-model:ro

volumes:
  # CUDA 対応 OpenCV の install 先。既定 image の OpenCV とは分けて保持する。
  # この volume へ書き込む build-opencv.sh --with-cuda は --user root で実行する。
  dgx-opencv-cuda:
  jetson-opencv-cuda:
