# SPDX-License-Identifier: Apache-2.0
#
# Purpose:
#   Start the three profiles - DGX Spark, Jetson Orin, and RTX Blackwell - with
#   the same configuration.
#
# How the CUDA Toolkit is supplied:
#   This file defaults to pinned mode. The required CUDA packages are pinned into
#   the image, which makes the image self-contained, so the reproducibility of
#   the measurement results is unaffected by CUDA updates on the host.
#
#   To use the mode that mounts the toolkit from the host, overlay
#   compose.mounted.yaml.
#
# Usage:
#   docker compose -f docker/compose.yaml build dgx-spark
#   docker compose -f docker/compose.yaml run --rm dgx-spark verify-environment.sh
#   docker compose -f docker/compose.yaml run --rm dgx-spark
#
#   mounted mode:
#   docker compose -f docker/compose.yaml -f docker/compose.mounted.yaml build dgx-spark
name: aruco3-cuda

x-common: &common
  runtime: nvidia
  working_dir: /workspace
  # Run as the host user so that no root-owned files are created in the
  # bind-mounted repository. There is no matching user inside the container, but
  # that does not hinder building or testing.
  user: "${ARUCO3_UID:-1000}:${ARUCO3_GID:-1000}"
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ARUCO3_VERIFY_ON_START: "${ARUCO3_VERIFY_ON_START:-0}"
    # With no matching user, HOME would be undefined. Give the tools somewhere to
    # write their caches.
    HOME: /tmp
  # Lift the default limits so the measurement conditions stay fixed during
  # benchmarking.
  ulimits:
    memlock: -1
    stack: 67108864

services:
  # DGX Spark GB10 (Blackwell, sm_121). The primary environment for development
  # and analysis.
  dgx-spark:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ubuntu:24.04
        ARUCO3_PROFILE: dgx-spark
        ARUCO3_CUDA_ARCH: "121"
        ARUCO3_CUDA_MODE: "${ARUCO3_CUDA_MODE:-pinned}"
        ARUCO3_CUDA_REPO_DISTRO: ubuntu2404
        ARUCO3_CUDA_REPO_ARCH: sbsa
        INSTALL_DEV_TOOLS: "1"
    image: aruco3-cuda:dgx-spark
    volumes:
      - ..:/workspace
      - dgx-opencv-cuda:/opt/opencv-cuda

  # Jetson Orin (Ampere, sm_87). The environment for latency and power
  # evaluation under conditions close to deployment.
  #
  # Like the other two profiles, this starts from a plain Ubuntu image and
  # installs CUDA from an NVIDIA apt repository. The repository is a different
  # one: the CUDA build for Tegra is published under repo.download.nvidia.com,
  # not under the ordinary developer.download.nvidia.com. Selecting the packages
  # this project actually uses brings the image from the 5.0 GB the l4t-cuda base
  # image cost down to 726 MB, with the same nvcc build.
  #
  # ARUCO3_JETSON_L4T_SUITE must match the L4T release on the device. r35.4 is
  # JetPack 5.1.2; JetPack 6.x is the r36 series and also needs ubuntu:22.04 as
  # the base image.
  jetson-orin:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ARUCO3_JETSON_BASE_IMAGE:-ubuntu:20.04}
        ARUCO3_PROFILE: jetson-orin
        ARUCO3_CUDA_ARCH: "87"
        ARUCO3_CUDA_MODE: "${ARUCO3_CUDA_MODE:-pinned}"
        ARUCO3_CUDA_REPO_FLAVOR: jetson
        ARUCO3_CUDA_REPO_SUITE: "${ARUCO3_JETSON_L4T_SUITE:-r35.4}"
        # The same set as the other profiles, at the version L4T ships.
        # cuda-cudart-dev is listed explicitly rather than left to nvcc's
        # dependencies, so that the recorded provenance names it.
        ARUCO3_CUDA_PACKAGES: "cuda-nvcc-11-4 cuda-cudart-dev-11-4 cuda-cccl-11-4 cuda-sanitizer-11-4 cuda-nvtx-11-4 cuda-cuobjdump-11-4 cuda-nvdisasm-11-4 cuda-profiler-api-11-4"
        INSTALL_DEV_TOOLS: "0"
    image: aruco3-cuda:jetson-orin
    # On Jetson the Tegra device nodes are root:video (some are root:debug) with
    # mode 0660. The host user belongs to video, but supplementary groups are not
    # carried over to the container user. Without granting them,
    # cudaGetDeviceCount fails with "NvRmMemInitNvmap failed with Permission
    # denied". The GIDs depend on the host, so allow .env to override them.
    group_add:
      - "${ARUCO3_JETSON_VIDEO_GID:-44}"
      - "${ARUCO3_JETSON_DEBUG_GID:-995}"
    volumes:
      - ..:/workspace
      - jetson-opencv-cuda:/opt/opencv-cuda
      # Sources for the power mode and L4T version that the evaluation plan
      # requires as measurement conditions. The nvpmodel binary is not present in
      # the container, so the state files are read directly. All of them are
      # world-readable and are mounted read-only.
      - ${ARUCO3_JETSON_L4T_RELEASE:-/etc/nv_tegra_release}:/etc/nv_tegra_release:ro
      - ${ARUCO3_JETSON_NVPMODEL_STATE:-/var/lib/nvpmodel}:/var/lib/nvpmodel:ro
      - ${ARUCO3_JETSON_NVPMODEL_CONF:-/etc/nvpmodel.conf}:/etc/nvpmodel.conf:ro
      # The device tree cannot be read directly because Docker masks
      # /sys/firmware. Mount just the board name separately.
      - ${ARUCO3_JETSON_MODEL_FILE:-/sys/firmware/devicetree/base/model}:/etc/aruco3cuda-platform-model:ro

  # Jetson AGX Thor (sm_110). The second Tegra machine, and the only one on the
  # r38 series.
  #
  # It differs from jetson-orin in every respect that matters to the build: L4T
  # r38.4 rather than r35.4, so Ubuntu 24.04 rather than 20.04, CUDA 13.0 rather
  # than 11.4, and Compute Capability 11.0 rather than 8.7. Only the repository
  # flavour is shared. The CUDA package names are the same 13-0 set the DGX Spark
  # and RTX Blackwell profiles use; they come from the L4T repository instead.
  #
  # There is no CUDA Toolkit on this host, so mounted mode is not available here.
  # That is why the profile installs the packages rather than mounting them.
  jetson-thor:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ARUCO3_THOR_BASE_IMAGE:-ubuntu:24.04}
        ARUCO3_PROFILE: jetson-thor
        ARUCO3_CUDA_ARCH: "110"
        ARUCO3_CUDA_MODE: "${ARUCO3_CUDA_MODE:-pinned}"
        ARUCO3_CUDA_REPO_FLAVOR: jetson
        ARUCO3_CUDA_REPO_SUITE: "${ARUCO3_THOR_L4T_SUITE:-r38.4}"
        ARUCO3_CUDA_PACKAGES: "cuda-nvcc-13-0 cuda-cudart-dev-13-0 cuda-cccl-13-0 cuda-sanitizer-13-0 cuda-nvtx-13-0 cuda-cuobjdump-13-0 cuda-nvdisasm-13-0 cuda-profiler-api-13-0"
        INSTALL_DEV_TOOLS: "0"
    image: aruco3-cuda:jetson-thor
    # Same reason as jetson-orin, but the debug GID differs per host, so it has
    # its own variable rather than sharing the Orin one.
    group_add:
      - "${ARUCO3_THOR_VIDEO_GID:-44}"
      - "${ARUCO3_THOR_DEBUG_GID:-982}"
    volumes:
      - ..:/workspace
      - thor-opencv-cuda:/opt/opencv-cuda
      - ${ARUCO3_THOR_L4T_RELEASE:-/etc/nv_tegra_release}:/etc/nv_tegra_release:ro
      - ${ARUCO3_THOR_NVPMODEL_STATE:-/var/lib/nvpmodel}:/var/lib/nvpmodel:ro
      - ${ARUCO3_THOR_NVPMODEL_CONF:-/etc/nvpmodel.conf}:/etc/nvpmodel.conf:ro
      - ${ARUCO3_THOR_MODEL_FILE:-/sys/firmware/devicetree/base/model}:/etc/aruco3cuda-platform-model:ro

  # RTX Blackwell (GB203, sm_120). A discrete GPU environment on x86_64.
  #
  # Both existing profiles use integrated GPUs, where host and device share the
  # same physical memory. The evaluation plan states explicitly that results from
  # an integrated GPU do not generalize to a discrete GPU, and this profile
  # exists to close that gap with real measurements. Transfer cost matters here,
  # so the differences between memory modes become meaningful for the first time.
  #
  # The base image and the CUDA packages are identical to dgx-spark. With the
  # container side aligned, the only difference between the two is the
  # hardware.
  rtx-blackwell:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ubuntu:24.04
        ARUCO3_PROFILE: rtx-blackwell
        ARUCO3_CUDA_ARCH: "120"
        ARUCO3_CUDA_MODE: "${ARUCO3_CUDA_MODE:-pinned}"
        ARUCO3_CUDA_REPO_DISTRO: ubuntu2404
        ARUCO3_CUDA_REPO_ARCH: x86_64
        INSTALL_DEV_TOOLS: "1"
    image: aruco3-cuda:rtx-blackwell
    volumes:
      - ..:/workspace
      - rtx-opencv-cuda:/opt/opencv-cuda

volumes:
  # Install location for the CUDA-enabled OpenCV, kept separate from the OpenCV
  # in the default image. build-opencv.sh --with-cuda, which writes to this
  # volume, must be run with --user root.
  dgx-opencv-cuda:
  jetson-opencv-cuda:
  thor-opencv-cuda:
  rtx-opencv-cuda:
