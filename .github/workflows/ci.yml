# SPDX-License-Identifier: Apache-2.0
#
# Only the checks that can run on a runner without a GPU.
#
# Detection correctness can only be confirmed on a GPU, so the 455 automated
# tests and Compute Sanitizer run on real hardware: DGX Spark GB10, Jetson AGX
# Orin, and GeForce RTX 5070 Ti. What CI protects is that the code compiles and
# that the documentation and formatting conventions hold; it is not a guarantee
# of correctness. Blurring that distinction invites reading a green CI run as
# proof of correctness.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting and documentation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Use the same 18.x series as the container. A different version produces
      # different formatting, so what passes locally fails in CI.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          echo "CLANG_FORMAT=clang-format-18" >> "$GITHUB_ENV"

      - name: Check formatting differences
        run: ./tools/check-format.sh

      - name: Check the Doxygen comments on the public headers
        run: python3 tools/check_doxygen.py

      - name: Check the relative links in the documentation
        run: python3 tools/check-doc-links.py

      - name: Check the SPDX identifiers on new source files
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -5 "$file" | grep -q 'SPDX-License-Identifier'; then
              echo "no SPDX identifier: $file"
              missing=1
            fi
          done < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.cu' '*.cuh' '*.py' '*.sh')
          exit "$missing"

  build:
    name: Build and CPU side tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Install through the same path as the development container. No
      # third-party action is used, so that the supplier stays the NVIDIA apt
      # repository.
      - name: Install the CUDA Toolkit
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          # This project does not use Thrust / CUB / libcu++, so the nvcc and
          # cudart development packages are enough. The sanitizer and profiler
          # the development container installs are unusable on a runner without
          # a GPU, so they are omitted.
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-0 cuda-cudart-dev-13-0
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - name: Install the build dependencies
        run: sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev

      # The CPU baseline runner, which needs OpenCV, is not built. Building
      # OpenCV from source would take most of the CI time, which is out of
      # proportion to the goal of catching compile regressions.
      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARUCO3CUDA_BUILD_REFERENCE=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="87;120;121"

      # Generate for the three architectures at once, to catch compile errors
      # that are specific to one of them.
      - name: Build
        run: cmake --build build/ci -j "$(nproc)"

      # Exclude the suites that require a GPU. If the set of suites listed here
      # grows or shrinks, CI fails and makes that visible. Never adjust it
      # silently.
      - name: Run the tests that do not require a device
        run: |
          ./build/ci/test/aruco3cuda_unit_tests \
            --gtest_filter=-AlignUpTest.*:CudaCheckTest.*:CudaCheckDeliberateErrorTest.*:DeviceProbeTest.*:WorkspaceTest.*

      # The samples build in tree with everything else. They also have to build
      # standalone against the installed package, which is the only form that
      # exercises find_package and the exported target names. An in-tree build
      # resolves the aliases directly, so a broken export set stays invisible
      # there.
      - name: Build the samples against the installed package
        run: |
          set -eux
          cmake --install build/ci --prefix "${{ runner.temp }}/prefix"
          cmake -S examples -B build/ci-examples -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/prefix"
          cmake --build build/ci-examples -j "$(nproc)"

      # generate_marker performs no detection, so it is the one sample that can
      # actually run here. Rendering exercises the packed dictionary tables,
      # which is worth confirming without a GPU.
      - name: Run the sample that needs no device
        run: |
          ./build/ci-examples/generate_marker --id 42 --size 200 --margin 40 \
            --output "${{ runner.temp }}/marker.pgm"
          test -s "${{ runner.temp }}/marker.pgm"

      # The Python package is ctypes over the C ABI, so there is nothing to
      # compile, but loading the shared object and reading the dictionary and
      # the default configuration through it needs no GPU and is exactly where a
      # mismatch between the C header and the hand-written ctypes mirror would
      # show up.
      - name: Run the Python tests that need no device
        env:
          PYTHONPATH: build/ci/python
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/cuda/targets/x86_64-linux/lib
        run: python3 -m unittest discover -s test/python -p 'test_binding.py' -v

      # The Python samples run against the same package. generate_marker.py
      # needs no device, and its output has to match the C++ sample byte for
      # byte, which is checked here rather than only on the GPU machines.
      - name: Run the Python sample that needs no device
        env:
          PYTHONPATH: build/ci/python:examples/python
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/cuda/targets/x86_64-linux/lib
        run: |
          set -eux
          python3 examples/python/generate_marker.py --id 42 --size 200 --margin 40 \
            --output "${{ runner.temp }}/marker-python.pgm"
          cmp "${{ runner.temp }}/marker.pgm" "${{ runner.temp }}/marker-python.pgm"
